<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text-mode slide editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
<style>
:root{--ui:#0d0f13;--panel:#151821;--line:#262b38;--fg:#d6d9e0;--dim:#8b93a5;--acc:#e5a24a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ui);color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;min-height:520px}
#bar{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
button,select,input[type=text]{font:inherit;color:var(--fg);background:#1b1f2a;border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover,select:hover{border-color:#3a4256}
button.on{background:#e8eaf0;color:#14161b;border-color:#e8eaf0}
button kbd{font:11px ui-monospace,Menlo,monospace;opacity:.55;margin-left:4px}
button.on kbd{opacity:.7}
.sw{width:26px;height:26px;padding:0;border-radius:6px;display:grid;place-items:center;font:700 13px ui-monospace,Menlo,monospace}
.sw.on{outline:2px solid #e8eaf0;outline-offset:1px;background:inherit}
input#brush{width:34px;text-align:center;padding:4px 2px;cursor:text;font-family:ui-monospace,Menlo,monospace}
label.ck{display:flex;gap:4px;align-items:center;color:var(--dim);cursor:pointer}
#main{display:grid;grid-template-columns:150px 1fr 270px;min-height:0}
#side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
#slides{display:flex;flex-direction:column;gap:8px}
.th{position:relative;border:1px solid var(--line);border-radius:6px;padding:3px;cursor:pointer;background:#0f1117}
.th.on{border-color:var(--acc)}
.th canvas{display:block;width:100%;height:auto;border-radius:3px}
.th span{position:absolute;left:6px;top:4px;font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
#sbtn{display:flex;flex-wrap:wrap;gap:4px}
#sbtn button{padding:3px 7px}
#stage{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;padding:12px}
#wrap{position:relative;box-shadow:0 0 0 1px #2a3040,0 20px 60px rgba(0,0,0,.5);border-radius:2px}
#cv{display:block;touch-action:none;cursor:crosshair}
#ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.eq{position:absolute;display:flex;align-items:center;white-space:nowrap;line-height:1;overflow:visible}
.eq.over{box-shadow:inset 0 -2px 0 #ff5f5f}
.eq .katex{font-size:1.06em}
#eqbar{position:absolute;display:none;align-items:stretch;z-index:5;font-family:"JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;box-shadow:0 4px 18px rgba(0,0,0,.45)}
#eqtag{display:grid;place-items:center;padding:0 .55em;font-weight:700;background:rgba(0,0,0,.38);color:#fff}
#eqin{flex:1;min-width:0;border:0;border-radius:0;outline:0;padding:0 .5em;font:inherit;background:transparent;color:inherit;caret-color:currentColor;cursor:text}
#eqprev{position:absolute;display:none;z-index:5;padding:.5em .8em;border:1px solid;border-radius:6px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#eqprev .ph{opacity:.5;font:12px system-ui,sans-serif}
#insp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#insp h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
#insp p{margin:0;color:var(--dim)}
#insp code,#help code{font:12px ui-monospace,Menlo,monospace;background:#1b1f2a;padding:1px 4px;border-radius:4px;color:var(--fg)}
textarea{width:100%;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--fg);background:#0f1117;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
#status{padding:6px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--dim);display:flex;gap:16px;font:12px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden}
#status b{color:var(--fg);font-weight:500}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:9}
#modal.on{display:grid}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(760px,92vw);padding:16px;display:flex;flex-direction:column;gap:10px}
#mbox h2{margin:0;font-size:15px}
#mbox textarea{height:46vh}
.row{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:900px){#main{grid-template-columns:110px 1fr}#insp{display:none}}
</style>
</head>
<body>
<div id="app">
 <div id="bar">
  <div class="grp" id="tools"></div>
  <div class="grp" id="attrs"></div>
  <div class="grp"><button id="rev" title="highlighted background (R): with cells selected, toggles it on them; otherwise toggles it for typing">bar<kbd>R</kbd></button></div>
  <div class="grp">
   <select id="theme"><option value="modern">modern</option><option value="c64">purple</option></select>
   <select id="size"><option value="40x25">40×25</option><option value="80x24" selected>80×24</option><option value="120x34">120×34</option></select>
  </div>
  <div class="grp">
   <button id="undo" title="Ctrl+Z">undo</button><button id="redo" title="Ctrl+Shift+Z">redo</button>
   <button id="preview" title="hide grid and editing marks">preview</button>
  </div>
  <div class="grp">
   <button id="bText">text</button><button id="bSave">save</button><button id="bOpen">open</button><button id="bNew">new</button>
  </div>
 </div>
 <div id="main">
  <div id="side"><div id="slides"></div><div id="sbtn"></div></div>
  <div id="stage"><div id="wrap"><canvas id="cv"></canvas><div id="ov"></div><div id="eqprev"></div><div id="eqbar"><span id="eqtag">$</span><input id="eqin" type="text" spellcheck="false" autocomplete="off"></div></div></div>
  <div id="insp"></div>
 </div>
 <div id="status"></div>
</div>
<div id="modal"><div id="mbox"></div></div>
<div id="meas" style="position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap"></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"></script>
<script>
(function(){
'use strict';
/* ====================================================================== constants */
var FONT='"JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,"Liberation Mono",monospace';
var THEMES={
  modern:{bg:'#14161B',c:['#D6D9E0','#FFFFFF','#E5A24A','#8B93A5'],p:'#E5A24A',q:'#4FA3E0'},
  c64:{bg:'#352879',c:['#C0B8F8','#FFFFFF','#F0E68C','#A096EC'],p:'#F0E68C',q:'#6FD6F2'}
};
var ATTR_NAMES=['normal','bright','accent','dim'];
var U=1,R=2,D=4,L=8;
var TOOLS=[
  ['select','select','V'],['box','box','B'],['line','line','L'],['text','text','T'],
  ['brush','draw','F'],['erase','erase','E'],['plot','plot','G']
];
var HINTS={
  select:'Drag to select cells (R toggles a highlighted bar on them), drag a selection to move it (arrow keys nudge, Delete clears, Ctrl+C/X/V). Click a vector object to select it.',
  box:'Drag a rectangle. Edges join automatically with neighbouring lines.',
  line:'Drag from start to end. Route is horizontal first; hold Shift for vertical first, Alt for an arrow head.',
  arrow:'Like line, with an arrow head at the end.',
  text:'Click a cell and type (R: type on a highlighted bar). Press $ to type an equation in the highlighted bar (live preview). Enter starts a new line; click an equation to edit it.',
  brush:'Paint with the brush character. Click the brush box in the toolbar and type or paste any character, or click a shade.',
  erase:'Drag to erase cells.',
  path:'Click points of a vector line; double-click or Enter to finish, Esc to cancel.',
  plot:'Drag a rectangle to place a plot; edit its data in the panel on the right.'
};
var GL={1:'│',4:'│',5:'│',2:'─',8:'─',10:'─',3:'└',6:'┌',12:'┐',9:'┘',7:'├',14:'┬',13:'┤',11:'┴',15:'┼'};
var ARROWS={'▶':1,'◀':1,'▲':1,'▼':1};
var STORE='textmode-slide-editor-v2';
var EQ_A='\u0002',EQ_C='\u0001';

/* ====================================================================== state */
var doc,cur=0,tool='select',attr=0,brushCh='█',rev=false,snapOn=true,previewOn=false,eqEdit=null;
var sel=null,selObj=-1,cursor=null,textX0=0,typing=false,hover=null,drag=null,creating=null,lastClick=0,lastClickPos=null;
var undoS=[],redoS=[],clip=null,caretOn=true,eqSig='',msg='';
var cwD=10,chD=22,fsD=16,dpr=1,cwC=10,chC=22,fsC=16,ratio=.6;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
var dirtyFlag=false,thumbDirty=true;

function mkSlide(cols,rows){var n=cols*rows;return{ch:new Array(n).fill(''),mk:new Array(n).fill(0),at:new Array(n).fill(0),vec:[]};}
function S(){return doc.slides[cur];}
function T(){return THEMES[doc.theme]||THEMES.modern;}
function ix(x,y){return y*doc.cols+x;}
function inb(x,y){return x>=0&&y>=0&&x<doc.cols&&y<doc.rows;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ====================================================================== cell operations */
function putCh(x,y,c,a){if(!inb(x,y))return;var g0=eqAt(x,y);if(g0)eqClear(g0);var s=S(),i=ix(x,y);s.ch[i]=c;s.mk[i]=0;s.at[i]=a;}
function clearCell(x,y){
  if(!inb(x,y))return;var g0=eqAt(x,y);if(g0)eqClear(g0);var s=S(),i=ix(x,y);s.ch[i]='';s.mk[i]=0;s.at[i]=0;
  if(inb(x,y-1))s.mk[ix(x,y-1)]&=~D;
  if(inb(x+1,y))s.mk[ix(x+1,y)]&=~L;
  if(inb(x,y+1))s.mk[ix(x,y+1)]&=~U;
  if(inb(x-1,y))s.mk[ix(x-1,y)]&=~R;
}
function bits(x,y,m,a){if(!inb(x,y))return;var s=S(),i=ix(x,y);s.mk[i]|=m;s.at[i]=a;if(s.ch[i]===' ')s.ch[i]='';}
function linkStep(x0,y0,x1,y1,a){
  if(x1>x0){bits(x0,y0,R,a);bits(x1,y1,L,a);}
  else if(x1<x0){bits(x0,y0,L,a);bits(x1,y1,R,a);}
  else if(y1>y0){bits(x0,y0,D,a);bits(x1,y1,U,a);}
  else if(y1<y0){bits(x0,y0,U,a);bits(x1,y1,D,a);}
}
function seg(x0,y0,x1,y1,a){
  var dx=Math.sign(x1-x0),dy=Math.sign(y1-y0),x=x0,y=y0;
  while(x!==x1||y!==y1){var nx=x+dx,ny=y+dy;linkStep(x,y,nx,ny,a);x=nx;y=ny;}
}
function route(a,b,vfirst,at){
  var cx=vfirst?a.x:b.x,cy=vfirst?b.y:a.y;
  seg(a.x,a.y,cx,cy,at);seg(cx,cy,b.x,b.y,at);
  return {cx:cx,cy:cy};
}
function drawLine(a,b,vfirst,arrow,at){
  route(a,b,vfirst,at);
  if(arrow&&(a.x!==b.x||a.y!==b.y)){
    var cx=vfirst?a.x:b.x,cy=vfirst?b.y:a.y,px,py;
    if(cx===b.x&&cy===b.y){px=a.x;py=a.y;}else{px=cx;py=cy;}
    var ch=b.x>px?'▶':b.x<px?'◀':b.y>py?'▼':'▲';
    var s=S(),i=ix(b.x,b.y);if(inb(b.x,b.y)){s.ch[i]=ch;s.at[i]=at;}
  }
}
function drawBox(a,b,at){
  var x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
  if(x0===x1||y0===y1){seg(x0,y0,x1,y1,at);return;}
  seg(x0,y0,x1,y0,at);seg(x0,y1,x1,y1,at);seg(x0,y0,x0,y1,at);seg(x1,y0,x1,y1,at);
}
function bres(x0,y0,x1,y1,fn){
  var dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy;
  for(;;){fn(x0,y0);if(x0===x1&&y0===y1)break;var e2=2*e;if(e2>-dy){e-=dy;x0+=sx;}if(e2<dx){e+=dx;y0+=sy;}}
}
function cloneGrid(){var s=S();return{ch:s.ch.slice(),mk:s.mk.slice(),at:s.at.slice()};}
function restoreGrid(g){var s=S();s.ch=g.ch.slice();s.mk=g.mk.slice();s.at=g.at.slice();}
function rectOf(a,b){var x0=Math.min(a.x,b.x),y0=Math.min(a.y,b.y);return{x:x0,y:y0,w:Math.abs(a.x-b.x)+1,h:Math.abs(a.y-b.y)+1};}
function extract(r){
  var s=S(),o={w:r.w,h:r.h,ch:[],mk:[],at:[]};
  for(var y=0;y<r.h;y++)for(var x=0;x<r.w;x++){
    if(inb(r.x+x,r.y+y)){var i=ix(r.x+x,r.y+y);o.ch.push(s.ch[i]);o.mk.push(s.mk[i]);o.at.push(s.at[i]);}
    else{o.ch.push('');o.mk.push(0);o.at.push(0);}
  }
  return o;
}
function clearRect(r){
  var s=S();
  for(var y=0;y<r.h;y++)for(var x=0;x<r.w;x++)if(inb(r.x+x,r.y+y)){var i=ix(r.x+x,r.y+y);s.ch[i]='';s.mk[i]=0;}
}
function pasteBuf(b,px,py){
  var s=S();
  for(var y=0;y<b.h;y++)for(var x=0;x<b.w;x++){
    var k=y*b.w+x;if(!b.ch[k]&&!b.mk[k])continue;
    if(!inb(px+x,py+y))continue;
    var i=ix(px+x,py+y);s.ch[i]=b.ch[k];s.mk[i]=b.mk[k];s.at[i]=b.at[k];
  }
}

/* ====================================================================== undo / persistence */
function snap(){return JSON.stringify({doc:doc,cur:cur});}
function loadSnap(str){var o=JSON.parse(str);doc=o.doc;cur=Math.min(o.cur,doc.slides.length-1);}
function pushUndo(pre){undoS.push(pre);if(undoS.length>120)undoS.shift();redoS=[];}
function commit(pre){if(snap()!==pre){pushUndo(pre);}save();}
function undo(){if(!undoS.length)return;redoS.push(snap());loadSnap(undoS.pop());afterLoad();}
function redo(){if(!redoS.length)return;undoS.push(snap());loadSnap(redoS.pop());afterLoad();}
function afterLoad(){sel=null;selObj=-1;cursor=null;typing=false;creating=null;syncUI();layout();refreshInspector();mark();save();}
var saveT=0;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){try{localStorage.setItem(STORE,snap());}catch(e){}},300);
}
function fresh(){
  var d={v:1,cols:80,rows:24,theme:'modern',slides:[]};
  doc=d;d.slides.push(mkSlide(80,24));cur=0;demo();
}

/* ====================================================================== text helpers */
function putText(x,y,str,a){for(var i=0;i<str.length;i++)putCh(x+i,y,str[i],a);}
function rowPlain(s,y){
  var r='';
  for(var x=0;x<doc.cols;x++){
    var i=ix(x,y),c=s.ch[i],a=eqParse(c);
    if(a){r+=a.disp?'$$'+a.tex+'$$':'$'+a.tex+'$';continue;}
    if(c===EQ_C)continue;
    r+=c?c:(s.mk[i]?(GL[s.mk[i]]||'┼'):' ');
  }
  return r;
}
function slideText(s){var o=[];for(var y=0;y<doc.rows;y++)o.push(rowPlain(s,y).replace(/\s+$/,''));while(o.length&&!o[o.length-1])o.pop();return o.join('\n');}
/* Equations live in the grid as a group of cells: one anchor cell holding the LaTeX source and the
   reserved width in cells, followed by continuation cells. The source never occupies grid space. */
function eqParse(c){var m=c&&c.charCodeAt(0)===2?c.match(/^\u0002([DI])(\d+):([\s\S]*)$/):null;return m?{disp:m[1]==='D',w:+m[2],tex:m[3]}:null;}
function eqAt(x,y){
  if(!doc||!inb(x,y))return null;var s=S(),c=s.ch[ix(x,y)],a;
  if(c===EQ_C){
    for(var k=x-1;k>=0;k--){
      var ck=s.ch[ix(k,y)];a=eqParse(ck);
      if(a){if(k+a.w>x){a.x=k;a.y=y;a.at=s.at[ix(k,y)]||0;return a;}return null;}
      if(ck!==EQ_C)return null;
    }
    return null;
  }
  a=eqParse(c);if(a){a.x=x;a.y=y;a.at=s.at[ix(x,y)]||0;return a;}
  return null;
}
function eqClear(g){var s=S();for(var k=0;k<g.w;k++){var X=g.x+k;if(!inb(X,g.y))continue;var i=ix(X,g.y);if(k===0||s.ch[i]===EQ_C)s.ch[i]='';}}
var htmlCache={};
function katexHtml(tex,disp){
  var k=(disp?'D':'I')+tex;if(htmlCache[k])return htmlCache[k];
  var h;try{h=katex.renderToString((disp?'\\displaystyle ':'')+tex,{throwOnError:false,output:'html',strict:false});}catch(e){h='<span style="color:#ff6b6b">'+tex.replace(/</g,'&lt;')+'</span>';}
  return htmlCache[k]=h;
}
var meas=document.getElementById('meas'),wCache={};
function eqCells(tex,disp){
  var k=tex+(disp?'D':'I')+fsC;if(wCache[k]!==undefined)return wCache[k];
  meas.style.fontSize=fsC+'px';meas.innerHTML='<div class="eq" style="position:static">'+katexHtml(tex,disp)+'</div>';
  var w=meas.firstChild.firstChild.getBoundingClientRect().width;
  return wCache[k]=Math.max(2,Math.ceil(w/cwC+.35));
}
function putEq(x,y,tex,disp,at){
  var w=Math.min(eqCells(tex,disp),doc.cols-x);if(w<1)return 0;
  for(var k=0;k<w;k++){var g=eqAt(x+k,y);if(g)eqClear(g);}
  var s=S();
  for(var j=0;j<w;j++){var i=ix(x+j,y);s.ch[i]=j===0?EQ_A+(disp?'D':'I')+w+':'+tex:EQ_C;s.mk[i]=0;s.at[i]=at;}
  return w;
}

/* ====================================================================== plots */
var plotCache={};
function mkRng(seed){
  var a=seed>>>0;
  function rnd(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  function gauss(){var u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd());}
  return{rnd:rnd,gauss:gauss};
}
function parsePlot(spec){
  if(plotCache[spec])return plotCache[spec];
  var o={xr:null,yr:null,title:'',xl:'',yl:'',series:[],err:''},block=null,m;
  var lines=spec.split('\n');
  for(var li=0;li<lines.length;li++){
    var l=lines[li].trim();
    if(!l||l[0]==='#'){block=null;continue;}
    if((m=l.match(/^x:\s*(\S+)\s+(\S+)/i))){o.xr=[+m[1],+m[2]];block=null;continue;}
    if((m=l.match(/^y:\s*(\S+)\s+(\S+)/i))){o.yr=[+m[1],+m[2]];block=null;continue;}
    if((m=l.match(/^(title|xlabel|ylabel):\s*(.*)$/i))){var k=m[1].toLowerCase();if(k==='title')o.title=m[2];else if(k==='xlabel')o.xl=m[2];else o.yl=m[2];continue;}
    if(l[0]==='='){o.series.push({expr:l.slice(1).trim(),pts:null});block=null;continue;}
    var nums=l.split(/[\s,;]+/).map(Number);
    if(nums.length>=2&&nums.every(isFinite)){if(!block){block={pts:[]};o.series.push(block);}block.pts.push([nums[0],nums[1]]);}
  }
  var xr=o.xr;
  if(!xr){
    var lo=Infinity,hi=-Infinity;
    o.series.forEach(function(s){if(s.pts)s.pts.forEach(function(p){lo=Math.min(lo,p[0]);hi=Math.max(hi,p[0]);});});
    xr=isFinite(lo)?[lo,hi]:[0,10];
  }
  o.xr=xr;
  o.series.forEach(function(s,si){
    if(!s.expr)return;
    var rng=mkRng(7+si*13),f;
    try{f=new Function('x','rnd','gauss','with(Math){return ('+s.expr+')}');}catch(e){o.err=String(e.message||e);s.pts=[];return;}
    s.pts=[];
    for(var i=0;i<=300;i++){
      var x=xr[0]+(xr[1]-xr[0])*i/300,y;
      try{y=+f(x,rng.rnd,rng.gauss);}catch(e){o.err=String(e.message||e);break;}
      if(isFinite(y))s.pts.push([x,y]);
    }
  });
  if(!o.yr){
    var ylo=Infinity,yhi=-Infinity;
    o.series.forEach(function(s){(s.pts||[]).forEach(function(p){ylo=Math.min(ylo,p[1]);yhi=Math.max(yhi,p[1]);});});
    if(!isFinite(ylo)){ylo=0;yhi=1;}

function polyPath(c,pts,smooth,px,py){

function drawPathObj(c,o,px,py,col,lw){

}
function drawPlotObj(c,o,px,py,Th,fs,lw){

/* ====================================================================== pointer interaction */
function pos(e){

  var st=snapOn?.5:0.01;

    snap:[Math.round(fx/st)*st,Math.round(fy/st)*st]};
}
function dseg(px,py,a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?clamp(((px-a[0])*dx+(py-a[1])*dy)/l,0,1):0;

function hitObj(p){

    if(o.t==='plot'){if(p.fx>=o.x&&p.fx<=o.x+o.w&&p.fy>=o.y&&p.fy<=o.y+o.h)return k;}
    else{
      var P=o.pts.map(function(q){return[q[0]*cwC,q[1]*chC];});
      for(var i=0;i<P.length-1;i++)if(dseg(p.px,p.py,P[i],P[i+1])<8)return k;
      if(P.length===1&&Math.hypot(p.px-P[0][0],p.py-P[0][1])<8)return k;

}
function hitHandle(p){

  for(var i=0;i<o.pts.length;i++)if(Math.hypot(p.px-o.pts[i][0]*cwC,p.py-o.pts[i][1]*chC)<10)return{k:'pt',i:i};

}

    if(k==='Backspace'){e.preventDefault();beginTyping();var gb=eqAt(cursor.x-1,cursor.y);if(gb){eqClear(gb);cursor.x=gb.x;}else if(cursor.x>0){cursor.x--;var i=ix(cursor.x,cursor.y);S().ch[i]='';}afterType();return;}
